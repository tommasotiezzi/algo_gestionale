<div class="auction-live-container">
        
        <!-- HEADER -->
        <div class="live-header">
            <div class="live-header-left">
                <button class="btn-icon" onclick="window.router?.navigate('dashboard')">
                    ← Exit
                </button>
                <h2 id="live-auction-name">test</h2>
            </div>
            
            <div class="live-header-center">
                <div class="live-status">
                    <span class="status-indicator"></span>
                    <span>LIVE</span>
                </div>
                <button class="btn btn-secondary btn-sm" id="toggle-timer-btn">
                    <span id="timer-status-text">⏱️ Timer: OFF</span>
                </button>
            </div>
            
            <div class="live-header-right">
                <button class="btn-icon" id="toggle-players-sidebar">📋</button>
            </div>
        </div>

        <!-- TOP HALF: AUCTION INTERFACE -->
        <div class="auction-top-half">
            <div class="main-grid">
                
                <!-- LEFT: BATTITORE -->
                <div class="battitore-panel">
                    <h3>Battitore</h3>
                    
                    <div class="control-group">
                        <label>SELEZIONA GIOCATORE</label>
                        <select id="player-selector">
                            <option value="">-- Scegli un giocatore --</option>
                        </select>
                        
                        <label>FILTRA PER RUOLO</label>
                        <div class="role-filters">
                            <button class="role-btn active" data-role="all">Tutti</button>
                            <button class="role-btn" data-role="P">P</button>
                            <button class="role-btn" data-role="D">D</button>
                            <button class="role-btn" data-role="C">C</button>
                            <button class="role-btn" data-role="A">A</button>
                        </div>
                        
                        <button id="call-player-btn">
                            📢 Chiama Giocatore
                        </button>
                    </div>
                    

                </div>
                
                <!-- RIGHT: GIOCATORE -->
                <div class="giocatore-panel">
                    
                    <!-- NO PLAYER STATE -->
                    <div class="no-player-state" id="no-player-state">
                        <div class="no-player-icon">⚽</div>
                        <h3>In attesa del prossimo giocatore...</h3>
                        <p>Seleziona o chiama un giocatore per iniziare</p>
                    </div>
                    
                    <!-- PLAYER DISPLAY -->
                    <div class="player-display" id="player-display">
                        
                        <!-- LEFT SIDE: PLAYER INFO -->
                        <div class="player-left">
                            <div class="player-card">
                                <div class="player-header">
                                    <div class="player-role" id="player-role">-</div>
                                    <div class="player-info">
                                        <h2 id="player-name">-</h2>
                                        <p id="player-team">-</p>
                                    </div>
                                </div>
                                
                                <div class="player-stats">
                                    <div class="stat">
                                        <span class="stat-label">QT</span>
                                        <span class="stat-value" id="player-qt">-</span>
                                    </div>
                                    <div class="stat">
                                        <span class="stat-label">MV PREV</span>
                                        <span class="stat-value" id="player-mv-prev">-</span>
                                    </div>
                                    <div class="stat">
                                        <span class="stat-label">FM PREV</span>
                                        <span class="stat-value" id="player-fm-prev">-</span>
                                    </div>
                                    <div class="stat">
                                        <span class="stat-label">FM ALL</span>
                                        <span class="stat-value" id="player-fm-all">-</span>
                                    </div>
                                    <div class="stat">
                                        <span class="stat-label">PMA</span>
                                        <span class="stat-value" id="player-pma">-</span>
                                    </div>
                                    <div class="stat">
                                        <span class="stat-label">MAX SPESA</span>
                                        <span class="stat-value" id="player-max-spend">-</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- RIGHT SIDE: BIDDING -->
                        <div class="player-right">
                            <!-- HIGHEST BIDDER -->
                            <div class="highest-bidder-section">
                                <div class="bidder-label">MIGLIOR OFFERENTE</div>
                                <select id="highest-bidder-team" class="bidder-team-select">
                                    <option value="">---</option>
                                </select>
                                <div class="bidder-amount" id="highest-bid-amount">-</div>
                                <div class="timer-display" id="timer-display">
                                    <span id="timer-countdown">--</span>
                                </div>
                            </div>
                            
                            <!-- BID CONTROLS -->
                            <div class="bid-controls-section">
                                <div class="bid-input-row">
                                    <button class="btn-adjust" id="bid-minus">−</button>
                                    <input type="number" id="bid-input" value="1" min="1">
                                    <button class="btn-adjust" id="bid-plus">+</button>
                                </div>
                                <div class="bid-actions-row">
                                    <button class="btn-action btn-bid" id="bid-btn">
                                        💰 Rilancia
                                    </button>
                                    <button class="btn-action btn-assign" id="assign-btn">
                                        ✓ Assegna
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                </div>
                
            </div>
        </div>

        <!-- BOTTOM HALF: TEAMS SECTION -->
        <div class="teams-bottom-half">
            <div class="teams-container">
                <div class="teams-grid" id="teams-grid">
                    <!-- Teams will be populated by JS -->
                </div>
            </div>
        </div>
        
    </div>
