<!-- AUTH SECTION CONTENT -->
<div class="auth-wrapper">
    <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
            <span class="auth-logo-icon">⚽</span>
            <h1>FANTASTA</h1>
            <p class="auth-subtitle">Gestione Aste Fantacalcio</p>
        </div>

        <!-- Tab Navigation -->
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Accedi</button>
            <button class="auth-tab" data-tab="register">Registrati</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label for="login-email" class="form-label">Email</label>
                <input 
                    type="email" 
                    id="login-email" 
                    class="form-control" 
                    placeholder="nome@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="login-password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="login-password" 
                    class="form-control" 
                    placeholder="••••••••"
                    required
                >
            </div>

            <div class="form-group">
                <div class="form-check">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Ricordami</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <span class="btn-text">Accedi</span>
                <span class="btn-loader hidden">
                    <span class="loading"></span>
                </span>
            </button>

            <div class="auth-divider">
                <span>oppure</span>
            </div>

            <button type="button" class="btn btn-secondary btn-block" id="demo-login-btn">
                <span>🎮</span>
                <span>Prova Demo</span>
            </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="register-username" class="form-label">Username</label>
                <input 
                    type="text" 
                    id="register-username" 
                    class="form-control" 
                    placeholder="Il tuo username"
                    minlength="3"
                    maxlength="20"
                    required
                >
                <small class="form-hint">Sarà visibile agli altri utenti</small>
            </div>

            <div class="form-group">
                <label for="register-email" class="form-label">Email</label>
                <input 
                    type="email" 
                    id="register-email" 
                    class="form-control" 
                    placeholder="nome@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="register-password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="register-password" 
                    class="form-control" 
                    placeholder="Min. 6 caratteri"
                    minlength="6"
                    required
                >
                <div class="password-strength" id="password-strength">
                    <div class="password-strength-bar"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="register-password-confirm" class="form-label">Conferma Password</label>
                <input 
                    type="password" 
                    id="register-password-confirm" 
                    class="form-control" 
                    placeholder="Ripeti password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <div class="form-check">
                    <input type="checkbox" id="accept-terms" required>
                    <label for="accept-terms">
                        Accetto i <a href="#" class="auth-link">Termini e Condizioni</a>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <span class="btn-text">Registrati</span>
                <span class="btn-loader hidden">
                    <span class="loading"></span>
                </span>
            </button>
        </form>

        <!-- Error/Success Messages -->
        <div id="auth-message" class="auth-message hidden">
            <span class="auth-message-icon"></span>
            <span class="auth-message-text"></span>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            <p>
                <a href="#" class="auth-link" id="forgot-password-link">Password dimenticata?</a>
            </p>
        </div>
    </div>
</div>

<!-- Forgot Password Modal -->
<div id="forgot-password-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3>Recupera Password</h3>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <p>Inserisci la tua email per ricevere le istruzioni per reimpostare la password.</p>
            <div class="form-group">
                <label for="reset-email" class="form-label">Email</label>
                <input 
                    type="email" 
                    id="reset-email" 
                    class="form-control" 
                    placeholder="nome@example.com"
                    required
                >
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="this.closest('.modal').classList.add('hidden')">
                Annulla
            </button>
            <button class="btn btn-primary" id="send-reset-email">
                Invia Email
            </button>
        </div>
    </div>
</div>
